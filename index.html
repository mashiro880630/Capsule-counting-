<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>膠囊進貨驗收計算器</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    transitionProperty: {
                        'colors': 'color, background-color, border-color, text-decoration-color, fill, stroke',
                    }
                }
            }
        }
    </script>

    <!-- 引入 React 與 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            transition: font-size 0.3s ease-in-out;
        }
        
        @keyframes fadeInSlow {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-slow {
            animation: fadeInSlow 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* 蘋果液態玻璃滑動按鈕樣式 */
        .apple-switch {
            position: relative;
            width: 52px;
            height: 31px;
            appearance: none;
            background: rgba(120, 120, 128, 0.16);
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            outline: none;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
        }

        .apple-switch:checked {
            background: #34c759;
            border-color: rgba(0, 0, 0, 0.01);
        }

        .dark .apple-switch:checked {
            background: #30d158;
        }

        .apple-switch::before {
            content: "";
            position: absolute;
            width: 27px;
            height: 27px;
            border-radius: 50%;
            top: 1px;
            left: 1px;
            background: white;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15), 0 1px 1px rgba(0,0,0,0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .apple-switch:checked::before {
            transform: translateX(21px);
            box-shadow: 0 3px 8px rgba(0,0,0,0.2), 0 0 0 1px rgba(0,0,0,0.02);
        }

        .apple-switch:active::before {
            width: 33px;
        }
        
        .apple-switch:checked:active::before {
            transform: translateX(15px);
        }
    </style>
</head>
<body class="transition-colors duration-500 bg-gray-50 dark:bg-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const IconCalculator = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} width="24" height="24"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16.01" y2="14"></line><line x1="16" y1="10" x2="16.01" y2="10"></line><line x1="16" y1="18" x2="16.01" y2="18"></line><line x1="8" y1="14" x2="8.01" y2="14"></line><line x1="8" y1="10" x2="8.01" y2="10"></line><line x1="12" y1="14" x2="12.01" y2="14"></line><line x1="12" y1="10" x2="12.01" y2="10"></line><line x1="8" y1="18" x2="8.01" y2="18"></line><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>;
        const IconCheck = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} width="20" height="20"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
        const IconPackage = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} width="20" height="20"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"></line><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>;
        const IconBox = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} width="20" height="20"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="M3.27 6.96 12 12.01 20.73 6.96"></path><path d="M12 22.08V12"></path></svg>;
        const IconScale = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} width="20" height="20"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path><path d="M7 21h10"></path><path d="M12 3v18"></path><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"></path></svg>;
        const IconAlert = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} width="24" height="24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
        const IconSun = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} width="16" height="16"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>;
        const IconMoon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} width="16" height="16"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>;
        const IconType = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} width="16" height="16"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>;

        const CapsuleBackground = () => {
            const capsules = useMemo(() => {
                const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];
                return Array.from({ length: 45 }).map((_, i) => ({
                    id: i,
                    left: `${(i * 27.3) % 100}vw`,
                    top: `${(i * 19.7) % 100}vh`,
                    rotate: (i * 137) % 360,
                    scale: 0.6 + ((i * 7) % 10) / 10,
                    colorTop: colors[i % colors.length],
                    colorBottom: (i % 3 === 0) ? colors[(i + 1) % colors.length] : '#ffffff',
                    opacity: 0.15 + ((i * 3) % 10) / 100
                }));
            }, []);

            return (
                <div className="fixed inset-0 z-[-1] overflow-hidden pointer-events-none transition-colors duration-500 bg-gray-100 dark:bg-gray-900">
                    {capsules.map(cap => (
                        <div
                            key={cap.id}
                            className="absolute flex flex-col items-center justify-center drop-shadow-md transition-opacity duration-500 opacity-60 dark:opacity-20"
                            style={{
                                left: cap.left,
                                top: cap.top,
                                transform: `rotate(${cap.rotate}deg) scale(${cap.scale})`
                            }}
                        >
                            <div style={{ backgroundColor: cap.colorTop }} className="w-8 h-10 rounded-t-full border border-black/5 dark:border-white/5"></div>
                            <div style={{ backgroundColor: cap.colorBottom }} className="w-8 h-10 rounded-b-full border border-black/5 dark:border-white/5"></div>
                            <div className="absolute top-3 left-2 w-2 h-4 bg-white/40 rounded-full blur-[1px]"></div>
                        </div>
                    ))}
                </div>
            );
        };

        function App() {
            const WEIGHT_LARGE_BOX = 0.83; 
            const WEIGHT_SMALL_BOX = 0.32; 
            const WEIGHT_FOIL_BAG = 0.08;  
            const TARE_PER_LARGE_BOX = WEIGHT_LARGE_BOX + (WEIGHT_SMALL_BOX * 2) + (WEIGHT_FOIL_BAG * 2);

            const [totalCapsules, setTotalCapsules] = useState('');
            const [boxCountInput, setBoxCountInput] = useState(''); // 預設為空，不顯示幾箱
            const [boxWeights, setBoxWeights] = useState([]);
            
            const [hasLoose, setHasLoose] = useState(false);
            const [looseWeight, setLooseWeight] = useState('');
            const [looseMethod, setLooseMethod] = useState('none');
            const [customLooseTare, setCustomLooseTare] = useState('');

            const [isDarkMode, setIsDarkMode] = useState(false);
            const [textSize, setTextSize] = useState('medium');

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDarkMode]);

            useEffect(() => {
                const sizes = { small: '14px', medium: '16px', large: '18px' };
                document.documentElement.style.fontSize = sizes[textSize];
            }, [textSize]);

            const handleBoxCountChange = (e) => {
                const valStr = e.target.value;
                setBoxCountInput(valStr);
                
                const count = parseInt(valStr);
                if (!isNaN(count) && count >= 0) {
                    setBoxWeights(prev => {
                        const newWeights = [...prev];
                        if (count > prev.length) {
                            for (let i = prev.length; i < count; i++) newWeights.push('');
                        } else if (count < prev.length) {
                            newWeights.splice(count);
                        }
                        return newWeights;
                    });
                } else if (valStr === '') {
                    setBoxWeights([]);
                }
            };

            const handleBoxWeightChange = (index, value) => {
                const newWeights = [...boxWeights];
                newWeights[index] = value;
                setBoxWeights(newWeights);
            };

            const validBoxWeights = boxWeights.map(w => parseFloat(w) || 0);
            const boxesGrossWeight = validBoxWeights.reduce((a, b) => a + b, 0);
            const filledBoxesCount = validBoxWeights.filter(w => w > 0).length;
            const boxesTareWeight = filledBoxesCount * TARE_PER_LARGE_BOX;

            let looseTareWeight = 0;
            if (hasLoose) {
                if (looseMethod === 'foil') looseTareWeight = WEIGHT_FOIL_BAG;
                else if (looseMethod === 'smallBoxFoil') looseTareWeight = WEIGHT_SMALL_BOX + WEIGHT_FOIL_BAG;
                else if (looseMethod === 'custom') looseTareWeight = parseFloat(customLooseTare) || 0;
            }

            const looseGrossWeight = hasLoose ? (parseFloat(looseWeight) || 0) : 0;
            const totalGrossWeight = boxesGrossWeight + looseGrossWeight;
            const totalTareWeight = boxesTareWeight + looseTareWeight;
            const totalNetWeight = Math.max(0, totalGrossWeight - totalTareWeight); 

            const capsulesCount = parseInt(totalCapsules) || 0;
            const weightPerCapsule = capsulesCount > 0 ? ((totalNetWeight * 1000000) / capsulesCount) : 0;

            const showBoxDetails = boxCountInput !== '' && parseInt(boxCountInput) > 0;

            return (
                <div className="min-h-screen p-4 md:p-8 text-gray-800 dark:text-gray-100 relative transition-colors duration-500">
                <CapsuleBackground />

                <div className="max-w-6xl mx-auto space-y-6 relative z-10">
                    <div className="flex justify-end items-center gap-3 md:gap-4 mb-2">
                        <div className="flex items-center gap-2 bg-white/80 dark:bg-gray-800/80 p-2 rounded-xl backdrop-blur-md shadow-sm border border-gray-200 dark:border-gray-700 transition-colors duration-300">
                            <IconType className="text-gray-500 dark:text-gray-400" />
                            <select 
                                value={textSize} 
                                onChange={e => setTextSize(e.target.value)} 
                                className="bg-transparent text-sm font-medium outline-none cursor-pointer dark:text-gray-200"
                            >
                                <option value="small" className="dark:bg-gray-800">小字體</option>
                                <option value="medium" className="dark:bg-gray-800">中字體</option>
                                <option value="large" className="dark:bg-gray-800">大字體</option>
                            </select>
                        </div>

                        <div className="flex items-center gap-3 bg-white/80 dark:bg-gray-800/80 px-3 py-2 rounded-xl backdrop-blur-md shadow-sm border border-gray-200 dark:border-gray-700 transition-colors duration-300">
                            {isDarkMode ? <IconMoon className="text-blue-400" /> : <IconSun className="text-amber-500" />}
                            <input 
                                type="checkbox" 
                                className="apple-switch" 
                                checked={isDarkMode}
                                onChange={() => setIsDarkMode(!isDarkMode)}
                            />
                        </div>
                    </div>

                    <header className="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md rounded-2xl shadow-sm p-8 border-t-4 border-blue-600 border-x border-b border-gray-200 dark:border-gray-700 transition-colors duration-300">
                        <div className="text-center">
                            <h1 className="text-3xl font-bold flex items-center justify-center gap-3 text-gray-800 dark:text-white transition-colors duration-300">
                                <IconCalculator className="text-blue-600 dark:text-blue-400 w-8 h-8" />
                                膠囊進貨驗收計算器
                            </h1>
                            <p className="text-gray-500 dark:text-gray-400 mt-2 text-base transition-colors duration-300">自動扣除標準包材重量，精準計算每粒膠囊毫克數</p>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 space-y-6">
                            
                            <section className="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md rounded-2xl shadow-sm p-6 border border-gray-100 dark:border-gray-700 transition-colors duration-300">
                                <h2 className="text-lg font-semibold mb-4 flex items-center gap-2 dark:text-white transition-colors duration-300">
                                    <IconCheck className="text-blue-500 dark:text-blue-400"/>
                                    驗收基礎資料
                                </h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1 transition-colors duration-300">進貨總粒數 (必填)</label>
                                        <div className="relative">
                                            <input 
                                                type="number" 
                                                className="w-full pl-3 pr-12 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white dark:bg-gray-700 dark:text-white"
                                                placeholder="請輸入總粒數"
                                                value={totalCapsules}
                                                onChange={(e) => setTotalCapsules(e.target.value)}
                                            />
                                            <span className="absolute right-3 top-2 text-gray-400 dark:text-gray-400">粒</span>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1 transition-colors duration-300">進貨大箱數</label>
                                        <div className="relative">
                                            <input 
                                                type="number" 
                                                min="0"
                                                className="w-full pl-3 pr-12 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white dark:bg-gray-700 dark:text-white"
                                                placeholder="請輸入大箱數"
                                                value={boxCountInput}
                                                onChange={handleBoxCountChange}
                                            />
                                            <span className="absolute right-3 top-2 text-gray-400 dark:text-gray-400">箱</span>
                                        </div>
                                    </div>
                                </div>
                            </section>

                            {showBoxDetails && (
                                <section className="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md rounded-2xl shadow-sm p-6 border border-gray-100 dark:border-gray-700 transition-colors duration-300 animate-fade-in-slow">
                                    <h2 className="text-lg font-semibold mb-4 flex items-center gap-2 dark:text-white transition-colors duration-300">
                                        <IconPackage className="text-blue-500 dark:text-blue-400"/>
                                        每箱實際重量登錄
                                    </h2>
                                    <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4">
                                        {boxWeights.map((weight, index) => (
                                            <div key={index} className="bg-gray-50/50 dark:bg-gray-900/50 p-3 rounded-lg border border-gray-200 dark:border-gray-700 transition-colors duration-300">
                                                <label className="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1">第 {index + 1} 箱</label>
                                                <div className="relative">
                                                    <input 
                                                        type="number" 
                                                        className="w-full px-2 py-1.5 text-sm border border-gray-300 dark:border-gray-600 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white dark:bg-gray-800 dark:text-white transition-colors"
                                                        placeholder="重量"
                                                        value={weight}
                                                        onChange={(e) => handleBoxWeightChange(index, e.target.value)}
                                                    />
                                                    <span className="absolute right-2 top-1.5 text-xs text-gray-400">kg</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            )}

                            <section className="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md rounded-2xl shadow-sm p-6 border border-gray-100 dark:border-gray-700 transition-colors duration-300">
                                <div className="flex items-center justify-between mb-4">
                                    <h2 className="text-lg font-semibold flex items-center gap-2 dark:text-white transition-colors duration-300">
                                        <IconBox className="text-blue-500 dark:text-blue-400"/>
                                        散貨資料
                                    </h2>
                                    <div className="flex items-center gap-3">
                                        <span className="text-sm font-medium text-gray-700 dark:text-gray-300 transition-colors duration-300">有散貨</span>
                                        <input 
                                            type="checkbox" 
                                            className="apple-switch" 
                                            checked={hasLoose}
                                            onChange={(e) => setHasLoose(e.target.checked)}
                                        />
                                    </div>
                                </div>

                                {hasLoose && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4 bg-blue-50/50 dark:bg-blue-900/20 p-4 rounded-xl border border-blue-100 dark:border-blue-800 transition-colors duration-300 animate-fade-in-slow">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">散貨實際總重量</label>
                                            <div className="relative">
                                                <input 
                                                    type="number" 
                                                    className="w-full pl-3 pr-12 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white dark:bg-gray-700 dark:text-white transition-colors"
                                                    placeholder="重量"
                                                    value={looseWeight}
                                                    onChange={(e) => setLooseWeight(e.target.value)}
                                                />
                                                <span className="absolute right-3 top-2 text-gray-400">kg</span>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">包裝方式</label>
                                            <select 
                                                className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white dark:bg-gray-700 dark:text-white transition-colors"
                                                value={looseMethod}
                                                onChange={(e) => setLooseMethod(e.target.value)}
                                            >
                                                <option value="none">無包材 (扣重: 0 kg)</option>
                                                <option value="foil">鋁箔袋 (扣重: 0.08 kg)</option>
                                                <option value="smallBoxFoil">小箱+鋁箔 (扣重: 0.40 kg)</option>
                                                <option value="custom">自訂重量...</option>
                                            </select>
                                        </div>
                                    </div>
                                )}
                            </section>
                        </div>

                        <div className="space-y-6">
                            <div className="bg-gray-800/95 dark:bg-gray-900/95 backdrop-blur-md rounded-2xl shadow-lg p-6 text-white sticky top-6 border border-gray-700 transition-colors duration-300">
                                <h2 className="text-lg font-semibold mb-6 flex items-center gap-2 border-b border-gray-700 pb-3 text-blue-300">
                                    <IconScale className="text-blue-400"/>
                                    結算數據
                                </h2>
                                <div className="space-y-4 text-sm">
                                    <div className="flex justify-between items-center text-gray-300">
                                        <span>總毛重</span>
                                        <span className="font-mono text-lg">{totalGrossWeight.toFixed(2)} kg</span>
                                    </div>
                                    <div className="flex justify-between items-center text-gray-400 border-l-2 border-gray-600 pl-2">
                                        <span>- 包材總扣重</span>
                                        <span className="font-mono">{totalTareWeight.toFixed(2)} kg</span>
                                    </div>
                                    <div className="pt-4 border-t border-gray-700 flex justify-between items-center">
                                        <span className="font-medium text-blue-200">膠囊總淨重</span>
                                        <span className="font-mono text-xl font-semibold text-blue-400">{totalNetWeight.toFixed(2)} kg</span>
                                    </div>
                                </div>

                                <div className="mt-8 bg-gray-900/80 dark:bg-black/50 rounded-xl p-5 border border-gray-700 text-center relative overflow-hidden shadow-inner">
                                    <div className="absolute top-0 left-0 w-full h-1 bg-blue-500"></div>
                                    <h3 className="text-gray-400 text-sm font-medium mb-2 uppercase tracking-wider">平均每粒膠囊重量</h3>
                                    {capsulesCount > 0 ? (
                                        <div className="flex items-end justify-center gap-1">
                                            <span className="text-5xl font-bold text-white tracking-tight drop-shadow-sm">{weightPerCapsule.toFixed(1)}</span>
                                            <span className="text-blue-400 font-medium mb-1 text-lg">mg</span>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col items-center justify-center py-4 text-yellow-500/80 gap-2">
                                            <IconAlert className="animate-pulse" />

                                <div className="mt-6 bg-gray-700/50 dark:bg-gray-800/50 rounded-lg p-4 text-[11px] text-gray-400 space-y-2 transition-colors duration-300">
